    <title>Catálogo da festa · peça sua música</title>
    <meta
      name="description"
      content="Busca instantânea no catálogo de karaokê da festa por código, título ou artista, com trecho da letra, a fila do salão ao vivo e a sua lista salva no aparelho."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Catálogo de Karaokê" />

      name="twitter:description"
      content="Busca instantânea por código, título ou artista, direto do computador do karaokê."
    />

    <script>
      /*
       * Aplica o tema antes do primeiro paint. Sem isto, quem usa tema claro
       * via um flash preto em cada recarga da página.
       */
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('karaoke:preferencias') || '{}');
          var prefereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
          var claro = prefs.tema === 'claro' || (prefs.tema !== 'escuro' && prefereClaro);
          var raiz = document.documentElement;
          raiz.classList.toggle('dark', !claro);
          raiz.style.colorScheme = claro ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', claro ? '#fafafd' : '#0e0d15');
        } catch (erro) {
          /* sem localStorage (modo privado restrito): segue o do sistema */
        }
      })();
    </script>
    <script type="module" crossorigin src="/p/assets/index-aSr3CbFs.js"></script>
    <link rel="stylesheet" crossorigin href="/p/assets/index-CQGVRvW3.css">
